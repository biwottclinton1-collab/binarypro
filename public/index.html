<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BinaryPro - Trade</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#050818;color:white;font-family:'Segoe UI',Arial}
    .navbar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#0a0f1e}
    .logo{font-weight:bold;font-size:20px}
    .logo span{color:#3b82f6}
    .nav-right{display:flex;gap:15px;align-items:center}
    .balance{color:#10b981;font-weight:bold;font-size:18px}
    .btn{background:#3b82f6;border:none;color:white;padding:8px 16px;border-radius:8px;font-weight:bold}
    .chart-box{padding:20px}
    #chart{width:100%;height:300px;background:linear-gradient(180deg,#0a1429 0%,#050818 100%)}
    .digits{display:flex;justify-content:space-between;padding:20px 10px;gap:8px}
    .oval{flex:1;text-align:center;background:#1a2338;border-radius:30px;padding:12px 5px;border:2px solid #2d3a5a;position:relative}
    .oval.active{border-color:#3b82f6;box-shadow:0 0 15px #3b82f6}
    .oval.win{border-color:#10b981;background:#064e3b}
    .oval.loss{border-color:#ef4444;background:#7f1d1d}
    .oval .num{font-size:16px;font-weight:bold}
    .oval .pct{font-size:11px;color:#10b981;margin-top:3px}
    .digit-label{text-align:center;color:#64748b;margin-bottom:10px}
    .mode-bar{display:flex;background:#0f172a;margin:10px 20px;border-radius:8px;padding:4px}
    .mode{flex:1;text-align:center;padding:12px;border-radius:6px;color:#94a3b8}
    .mode.active{background:#1e293b;color:white}
    .trade-box{background:#0f172a;margin:10px 20px;border-radius:12px;padding:20px}
    .stake-box{background:#1e293b;padding:15px;border-radius:8px;text-align:center;margin:10px 0}
    .stake-controls{display:flex;justify-content:space-between;align-items:center}
    .stake-btn{width:35px;height:35px;border-radius:50%;background:#334155;border:none;color:white;font-size:20px}
    .tp-sl{display:flex;gap:10px}
    .tp{background:#065f46;padding:15px;border-radius:8px;flex:1}
    .sl{background:#991b1b;padding:15px;border-radius:8px;flex:1}
    .place-btn{width:100%;padding:16px;background:#3b82f6;border:none;border-radius:10px;color:white;font-size:18px;font-weight:bold;margin-top:15px}
    .auth{padding:60px 20px;text-align:center}
    .auth input{width:100%;max-width:400px;padding:14px;margin:10px auto;display:block;border-radius:10px;border:1px solid #334155;background:#1e293b;color:white}
    .dashboard{display:none}
  </style>
</head>
<body>

  <!-- LOGIN / REGISTER -->
  <div id="authBox" class="auth">
    <h1 class="logo">Binary<span>Pro</span></h1>
    <div id="registerBox">
      <h2>Create Account</h2>
      <input id="regName" placeholder="Full Name">
      <input id="regEmail" placeholder="Email">
      <input id="regPass" type="password" placeholder="Password">
      <button class="btn" onclick="register()" style="width:100%;max-width:400px">Register</button>
      <p style="margin-top:10px">Have account? <a onclick="showLogin()" style="color:#3b82f6">Login</a></p>
    </div>
    <div id="loginBox" style="display:none">
      <h2>Login</h2>
      <input id="logEmail" placeholder="Email">
      <input id="logPass" type="password" placeholder="Password">
      <button class="btn" onclick="login()" style="width:100%;max-width:400px">Login</button>
      <p style="margin-top:10px">No account? <a onclick="showRegister()" style="color:#3b82f6">Register</a></p>
    </div>
    <div id="authMsg" style="color:#10b981"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="dashboard">
    <div class="navbar">
      <div class="logo">Binary<span>Pro</span></div>
      <div class="nav-right">
        <span>Real</span>
        <span class="balance">$<span id="balance">8000.00</span></span>
        <button class="btn">Logout</button>
      </div>
    </div>

    <div class="chart-box">
      <canvas id="chart"></canvas>
    </div>

    <!-- 10 OVALS -->
    <div class="digits" id="digitsRow"></div>
    <div class="digit-label">digit: <span id="currentDigit">3</span></div>

    <div class="mode-bar">
      <div class="mode active">Manual</div>
      <div class="mode">Bot</div>
    </div>

    <!-- TRADE INPUTS -->
    <div class="trade-box">
      <div class="stake-box">
        <div style="color:#94a3b8;font-size:12px">BASE STAKE</div>
        <div class="stake-controls">
          <button class="stake-btn" onclick="changeStake(-1)">-</button>
          <div style="font-size:22px;font-weight:bold">$ <span id="stake">10</span></div>
          <button class="stake-btn" onclick="changeStake(1)">+</button>
        </div>
      </div>

      <div class="tp-sl">
        <div class="tp">TARGET PROFIT<br><b>$ <span id="tp">20</span></b></div>
        <div class="sl">STOP LOSS<br><b>$ <span id="sl">15</span></b></div>
      </div>

      <button class="place-btn" onclick="placeTrade()">Place Trade</button>
      <div id="msg" style="text-align:center;margin-top:10px;font-weight:bold"></div>
    </div>
  </div>

<script>
let balance = 8000;
let stake = 10;
let tp = 20;
let sl = 15;
let currentDigit = 3;
let priceData = [];
let token = localStorage.getItem('token');

if(!token){ 
  document.getElementById('authBox').style.display='block'; 
  document.getElementById('dashboard').style.display='none'; 
} else {
  document.getElementById('authBox').style.display='none'; 
  document.getElementById('dashboard').style.display='block'; 
  initChart(); drawDigits();
}

function showLogin(){document.getElementById('registerBox').style.display='none'; document.getElementById('loginBox').style.display='block';}
function showRegister(){document.getElementById('loginBox').style.display='none'; document.getElementById('registerBox').style.display='block';}

async function register(){
  const res = await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:regName.value,email:regEmail.value,password:regPass.value})});
  authMsg.innerText = (await res.json()).message;
}
async function login(){
  const res = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:logEmail.value,password:logPass.value})});
  const data = await res.json();
  if(data.token){ localStorage.setItem('token', data.token); location.reload(); }
  else{ authMsg.innerText = data.message; }
}

function changeStake(d){ 
  stake += d; 
  if(stake<1) stake=1; 
  document.getElementById('stake').innerText=stake;
  tp = stake*2;
  sl = stake*1.5;
  document.getElementById('tp').innerText=tp;
  document.getElementById('sl').innerText=sl;
}

function drawDigits(){
  const row = document.getElementById('digitsRow');
  row.innerHTML = '';
  for(let i=0;i<10;i++){
    let pct = (Math.random()*10+5).toFixed(1);
    row.innerHTML += `
      <div class="oval ${i===currentDigit?'active':''}" id="d${i}">
        <div class="num">${i}</div>
        <div class="pct">${pct}%</div>
      </div>
    `;
  }
  setInterval(()=>{
    document.querySelectorAll('.oval').forEach(d=>d.classList.remove('active','win','loss'));
    currentDigit = Math.floor(Math.random()*10);
    document.getElementById('currentDigit').innerText=currentDigit;
    document.getElementById(`d${currentDigit}`).classList.add('active');
  }, 1500);
}

function initChart(){
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth;
  canvas.height = 300;
  
  // Generate initial data ONCE
  let y = 150;
  for(let i=0;i<canvas.width;i++){
    y += (Math.random()-0.5)*3;
    if(y<50) y=50; if(y>250) y=250;
    priceData.push(y);
  }
  
  function render(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle='#10b981'; ctx.lineWidth=2; ctx.beginPath();
    for(let x=0;x<priceData.length;x++){
      if(x===0) ctx.moveTo(x,priceData[x]); else ctx.lineTo(x,priceData[x]);
    }
    ctx.stroke();
    
    // Add new point and remove old
    priceData.shift();
    let lastY = priceData[priceData.length-1];
    let newY = lastY + (Math.random()-0.5)*3;
    if(newY<50) newY=50; if(newY>250) newY=250;
    priceData.push(newY);
  }
  setInterval(render, 100); // Smooth, no blink
}

function placeTrade(){
  if(stake > balance){ msg.innerText="Not enough balance"; msg.style.color="#ef4444"; return; }
  balance -= stake;
  let win = Math.random() > 0.5;
  
  let oval = document.getElementById(`d${currentDigit}`);
  oval.classList.add(win?'win':'loss');
  setTimeout(()=>oval.classList.remove('win','loss'), 2000);
  
  if(win){ balance += stake * 1.8; msg.innerText=`WIN +$${(stake*0.8).toFixed(2)}`; msg.style.color="#10b981"; }
  else { msg.innerText=`LOSS -$${stake.toFixed(2)}`; msg.style.color="#ef4444"; }
  document.getElementById('balance').innerText=balance.toFixed(2);
}
</script>
</body>
</html>
