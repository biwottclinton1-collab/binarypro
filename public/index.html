<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BinaryPro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:#0a0e14;color:#fff;overflow-x:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 15px;background:#0f1421;border-bottom:1px solid #1a2332}
.logo{font-size:20px;font-weight:800}.logo span{color:#3b82f6}
.rtop{display:flex;gap:8px;align-items:center}
.bal{color:#fff;font-size:13px;font-weight:800}
.btn{padding:7px 12px;border:0;border-radius:5px;font-weight:700;font-size:13px;cursor:pointer}
.btn-blue{background:#2563eb;color:#fff}.btn-gray{background:#374151;color:#fff}
.dropdown{position:absolute;top:45px;right:90px;background:#1a2332;border-radius:6px;display:none;flex-direction:column;z-index:99;min-width:130px;border:1px solid #334155}
.dropdown button{padding:10px 12px;background:0;border:0;color:#fff;text-align:left;font-size:13px;width:100%;cursor:pointer}
.wrap{padding:10px}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sel{background:#1a2332;color:#fff;border:1px solid #334155;padding:8px;border-radius:5px;font-size:12px}
.main{display:flex;gap:10px}
.history{width:160px;background:#0a1120;border-radius:8px;padding:8px;font-size:10px}
.history h4{font-size:11px;margin-bottom:5px;text-align:center;color:#94a3b8}
.total{color:#22c55e;font-weight:800;text-align:center;margin-bottom:5px;font-size:13px}
.hist-item{padding:5px;margin:3px 0;border-radius:4px;font-size:10px}
.hist-win{background:#16a34a33;color:#22c55e}
.chart-wrap{flex:1}
.chart{width:100%;height:45vh;background:#000;border-radius:8px;position:relative;overflow:hidden}
#chart{width:100%;height:100%;display:block}
.pTag{position:absolute;right:10px;background:#1f2937;padding:4px 7px;border-radius:4px;font-size:11px}
.digs{display:flex;justify-content:space-between;margin:10px 0;position:relative}
.dig{width:38px;height:38px;border-radius:50%;background:#111827;border:1.5px solid #2a3441;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.dig span{font-size:8px;color:#94a3b8}
.dig.active{border:2px solid #3b82f6;box-shadow:0 0 10px #3b82f6}
.pointer{position:absolute;width:12px;height:12px;border-radius:50%;background:#3b82f6;box-shadow:0 0 12px #3b82f6;top:-6px;transition:0.2s;z-index:3}
.time{display:flex;justify-content:space-between;font-size:9px;color:#64748b;margin-bottom:10px}
.btns{display:flex;gap:8px;margin-bottom:10px}
.btns button{flex:1;padding:22px;border:0;border-radius:8px;color:#fff;font-weight:800;font-size:18px;cursor:pointer;opacity:0.6}
.btns button.recommended{opacity:1;box-shadow:0 0 20px rgba(59,130,246,0.5)}
.g{background:#16a34a}.r{background:#dc2626}
.btns button small{display:block;font-size:11px;font-weight:500;margin-top:4px}
.tabs{display:flex;background:#1a2332;border-radius:6px;padding:4px;margin-bottom:8px}
.tab{flex:1;text-align:center;padding:11px;border-radius:4px;font-weight:700;font-size:13px;cursor:pointer}
.tab.active{background:#2563eb}
.sub{display:flex;gap:6px;margin-bottom:10px}
.sub div{flex:1;text-align:center;padding:11px;background:#1a2332;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer}
.sub.active{background:#2563eb}
.stake{background:#0a1120;padding:12px;border-radius:8px;text-align:center}
.sth{font-size:12px;color:#94a3b8;margin-bottom:7px}
.srow{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.sb{width:32px;height:32px;background:#1a2332;border:1px solid #334155;color:#fff;border-radius:4px;font-size:18px;cursor:pointer}
.sam{display:flex;gap:5px;margin-bottom:5px;flex-wrap:wrap}
.sam button{flex:1;padding:8px;background:#1a2332;border:1px solid #334155;color:#fff;border-radius:5px;font-size:11px;cursor:pointer;min-width:60px}
.sam button.active{background:#2563eb;border-color:#2563eb}
.ticks{font-size:11px;color:#94a3b8;margin-bottom:7px}
.ai{width:75px;height:75px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border:0;color:#fff;font-weight:800;font-size:17px;margin:10px auto;display:block;box-shadow:0 0 20px rgba(59,130,246,0.6);cursor:pointer}
.signal{color:#22c55e;font-size:13px;font-weight:700;margin:6px 0;text-align:center;min-height:22px}
.place-bar{display:none;background:#16a34a;padding:14px;border-radius:8px;text-align:center;font-weight:800;font-size:15px;margin:10px 0;cursor:pointer}
.popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a2332;padding:18px 25px;border-radius:10px;font-weight:800;font-size:18px;z-index:999;display:none}
.popup.win{border:2px solid #22c55e;color:#22c55e}
.popup.loss{border:2px solid #ef4444;color:#ef4444}
.auth{text-align:center;padding-top:80px;background:#0a0e14;min-height:100vh}
.auth h1{font-size:36px;margin-bottom:25px}
.auth input{width:90%;max-width:380px;padding:14px;margin:10px;background:#1a2332;border:1px solid #334155;color:#fff;border-radius:8px;font-size:15px}
.auth .btn{padding:14px 35px;margin:6px;font-size:15px}
#msg{font-size:15px;margin-top:12px;font-weight:700}
#dash{display:none}
</style>
</head>
<body>

<div id="auth" class="auth">
<h1 class="logo">Binary<span>Pro</span></h1>
<input id="remail" placeholder="Email"><br>
<input id="rpass" type="password" placeholder="Password"><br>
<button class="btn btn-blue" onclick="reg()">Register</button>
<button class="btn btn-blue" onclick="log()">Login</button>
<div id="msg"></div>
</div>

<div id="dash">
<div class="top">
<div class="logo">Binary<span>Pro</span></div>
<div class="rtop">
<span class="bal">Real $<span id="balance">8009.52</span></span>                                                   
<button class="btn btn-blue" onclick="drop()">Deposit ▼</button>
<div class="dropdown" id="dropdown">
<button onclick="alert('Deposit')">💰 Deposit</button>
<button onclick="alert('Withdraw')">🏦 Withdraw</button>
</div>
<button class="btn btn-gray" onclick="logout()">Logout</button>
</div>
</div>
<div class="wrap"><h2 style="text-align:center">Dashboard Loaded ✅</h2></div>
</div>

<script>
const API = "https://binarypro-1.onrender.com";
let balance = 8009.52;
let stake = 10;
let token = localStorage.getItem('t');

// AUTH FUNCTIONS
async function reg() {
  const email = document.getElementById("remail").value;
  const password = document.getElementById("rpass").value;
  const msg = document.getElementById("msg");
  if(!email || !password) { msg.innerText = "Fill both fields"; msg.style.color="red"; return; }
  msg.innerText = "Registering...";
  msg.style.color="#94a3b8";
  
  try {
    const res = await fetch(API + "/api/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    msg.innerText = data.message;
    msg.style.color = res.ok ? "#22c55e" : "red";
    if(res.ok) { setTimeout(() => log(), 1200); }
  } catch(e) {
    msg.innerText = "Network Error: " + e.message;
    msg.style.color="red";
  }
}

async function log() {
  const email = document.getElementById("remail").value;
  const password = document.getElementById("rpass").value;
  const msg = document.getElementById("msg");
  if(!email || !password) { msg.innerText = "Fill both fields"; msg.style.color="red"; return; }
  msg.innerText = "Logging in...";
  msg.style.color="#94a3b8";
  
  try {
    const res = await fetch(API + "/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if(data.token) {
      token = data.token;
      localStorage.setItem('t', data.token);
      msg.innerText = "Login success!";
      msg.style.color="#22c55e";
      setTimeout(() => {
        document.getElementById("auth").style.display = "none";
        document.getElementById("dash").style.display = "block";
      }, 800);
    } else {
      msg.innerText = data.message || "Login failed";
      msg.style.color="red";
    }
  } catch(e) {
    msg.innerText = "Network Error: " + e.message;
    msg.style.color="red";
  }
}

function logout() {
  localStorage.removeItem('t');
  location.reload();
}

function drop() { 
  const d = document.getElementById('dropdown');
  d.style.display = d.style.display === 'flex' ? 'none' : 'flex'; 
}

// SHOW DASH IF LOGGED IN
if(token) {
  document.getElementById("auth").style.display = "none";
  document.getElementById("dash").style.display = "block";
}
</script>
</body>
</html>
