<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BinaryPro</title>
<style>
body{background:#0a0e1a;color:#fff;margin:0;font-family:Arial}
.topbar{display:flex;justify-content:space-between;padding:10px;background:#0f1424}
.logo{font-weight:800;font-size:18px}.logo span{color:#3b82f6}
.bal{background:#1a2332;padding:5px 10px;border-radius:5px}
.btn{background:#2563eb;color:#fff;border:0;padding:8px 16px;border-radius:5px;cursor:pointer;font-weight:700}
.main{display:flex}.center{flex:1;padding:10px}
#chart{width:100%;height:280px;background:#070b14;border-radius:5px}
.digits{display:flex;gap:5px;justify-content:center;margin:10px 0}
.digit{width:45px;height:45px;border-radius:50%;background:#1a2332;border:2px solid #2a3441;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px}
.digit.active{border-color:#60a5fa}
.trade{display:flex;gap:8px}.trade button{flex:1;padding:18px;border:0;border-radius:8px;font-weight:800;font-size:16px;color:#fff;cursor:pointer}
.green{background:#16a34a}.red{background:#dc2626}
.right{width:320px;background:#0b101d;padding:10px}
.auth{text-align:center;padding-top:100px}
.auth input{width:300px;padding:12px;margin:8px;background:#1a2332;border:1px solid #334155;color:#fff;border-radius:6px}
#dashboard{display:none}
.msg{margin-top:10px;font-weight:700}
</style>
</head>
<body>

<div id="auth" class="auth">
<h1 class="logo">Binary<span>Pro</span></h1>
<div id="regBox">
<h2>Register</h2>
<input id="rname" placeholder="Full Name"><br>
<input id="remail" placeholder="Email"><br>
<input id="rpass" type="password" placeholder="Password"><br>
<button class="btn" onclick="doRegister()">Register</button>
<p>Have account? <a onclick="showLogin()" style="color:#3b82f6;cursor:pointer">Login</a></p>
</div>
<div id="logBox" style="display:none">
<h2>Login</h2>
<input id="lemail" placeholder="Email"><br>
<input id="lpass" type="password" placeholder="Password"><br>
<button class="btn" onclick="doLogin()">Login</button>
<p>No account? <a onclick="showReg()" style="color:#3b82f6;cursor:pointer">Register</a></p>
</div>
<div id="msg" class="msg" style="color:#22c55e"></div>
</div>

<div id="dashboard">
<div class="topbar">
<div class="logo">Binary<span>Pro</span></div>
<div><span class="bal">Real $<span id="balance">8000.00</span></span> <button class="btn">Deposit</button> <button class="btn" onclick="logout()">Logout</button></div>
</div>
<div class="main">
<div class="center">
<div style="display:flex;justify-content:space-between;margin-bottom:8px"><b>Volatility 10 (1s) Index</b><div><span id="cprice">9599.71</span> <span style="color:#f87171">-47.77</span></div></div>
<canvas id="chart"></canvas>
<div class="digits" id="digits"></div>
<div style="display:flex;justify-content:center;gap:20px;font-size:10px;color:#64748b;margin:8px 0"><span>03:14:28</span><span>03:14:43</span><span>03:14:59</span></div>
<div class="trade"><button class="green" onclick="trade('EVEN')">Even<br><small id="evenP">19.52 USD 95.22%</small></button><button class="red" onclick="trade('ODD')">Odd<br><small id="oddP">19.52 USD 95.22%</small></button></div>
</div>
<div class="right">
<h4>STAKE: $<span id="stake">10</span></h4>
<button onclick="changeStake(-1)">-</button><button onclick="changeStake(1)">+</button>
<div>Payout: $<span id="payout">19.52</span></div>
<button style="width:60px;height:60px;border-radius:50%;background:#3b82f6;border:0;color:#fff;margin-top:10px" onclick="alert('AI Trade')">AI</button>
<div id="tmsg" class="msg"></div>
</div>
</div>
</div>

<script>
let balance=8000,stake=10,token=localStorage.token;
const pct=[10.8,10.2,10.2,9.0,10.6,9.6,9.2,11.6,9.8,9.0];

if(token){auth.style.display='none';dashboard.style.display='block';loadUser();}

function showLogin(){regBox.style.display='none';logBox.style.display='block';msg.innerText=''}
function showReg(){logBox.style.display='none';regBox.style.display='block';msg.innerText=''}
function logout(){localStorage.removeItem('token');location.reload();}

async function doRegister(){
msg.style.color='#22c55e';
let r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:rname.value,email:remail.value,password:rpass.value})});
msg.innerText=(await r.json()).message;
}

async function doLogin(){
msg.style.color='#ef4444';
let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:lemail.value,password:lpass.value})});
let d=await r.json();
if(d.token){localStorage.token=d.token;location.reload();}else{msg.innerText=d.message;}
}

async function loadUser(){
let r=await fetch('/api/me',{headers:{'Authorization':'Bearer '+token}});
let u=await r.json();balance=parseFloat(u.balance);document.getElementById('balance').innerText=balance.toFixed(2);init();
}

function changeStake(n){stake+=n;if(stake<1)stake=1;document.getElementById('stake').innerText=stake;document.getElementById('payout').innerText=(stake*1.952).toFixed(2);evenP.innerText=(stake*1.952).toFixed(2)+' USD 95.22%';oddP.innerText=(stake*1.952).toFixed(2)+' USD 95.22%';}

async function trade(t){
if(stake>balance){tmsg.innerText='No balance';tmsg.style.color='red';return;}
balance-=stake;let win=Math.random()>0.5;
if(win){balance+=stake*1.952;tmsg.innerText='WIN';tmsg.style.color='#22c55e';}else{tmsg.innerText='LOSS';tmsg.style.color='#ef4444';}
document.getElementById('balance').innerText=balance.toFixed(2);
await fetch('/api/update-balance',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({newBalance:balance})});
}

function init(){
digits.innerHTML='';for(let i=0;i<10;i++)digits.innerHTML+=`<div class="digit" id="d${i}">${i}<div style="font-size:6px;color:#22c55e">${pct[i]}%</div></div>`;
setInterval(()=>{document.querySelectorAll('.digit').forEach(d=>d.classList.remove('active'));let dg=Math.floor(Math.random()*10);document.getElementById('d'+dg).classList.add('active');},2000);
const c=chart,ctx=c.getContext('2d');c.width=c.offsetWidth;c.height=280;let data=[];for(let i=0;i<c.width;i++)data.push(140);setInterval(()=>{ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle='#fff';ctx.beginPath();for(let x=0;x<data.length;x++)x?ctx.lineTo(x,data[x]):ctx.moveTo(x,data[x]);ctx.stroke();data.shift();data.push(data[data.length-1]+(Math.random()-0.5)*10);},100);
}
</script>
</body>
</html>
