<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BinaryPro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0e14;color:#fff}
.top{display:flex;justify-content:space-between;padding:10px;background:#0f1421;position:relative}
.logo{font-size:18px;font-weight:800}.logo span{color:#3b82f6}
.rtop{display:flex;gap:6px;align-items:center}
.bal{background:#1a2332;padding:5px 10px;border-radius:6px;font-size:12px;font-weight:800}
.btn{padding:6px 10px;border:0;border-radius:5px;font-weight:700;font-size:12px;cursor:pointer}
.btn-blue{background:#2563eb;color:#fff}.btn-gray{background:#374151;color:#fff}
.dropdown{position:absolute;top:45px;right:80px;background:#1a2332;border-radius:6px;display:none;flex-direction:column;z-index:99;min-width:120px;border:1px solid #334155;box-shadow:0 4px 10px rgba(0,0,0,0.5)}
.dropdown button{padding:10px 12px;background:0;border:0;color:#fff;text-align:left;font-size:13px;width:100%;cursor:pointer}
.dropdown button:hover{background:#2563eb}
.wrap{padding:8px}
.auth{text-align:center;padding-top:100px;background:#0a0e14;min-height:100vh}
.auth h1{font-size:32px;margin-bottom:20px}
.auth input{width:85%;max-width:350px;padding:12px;margin:8px;background:#1a2332;border:1px solid #334155;color:#fff;border-radius:6px;font-size:14px}
.auth.btn{padding:12px 30px;margin:5px;font-size:14px}
#msg{font-size:14px;margin-top:10px}
#dash{display:none}
</style>
</head>
<body>

<div id="auth" class="auth">
<h1 class="logo">Binary<span>Pro</span></h1>
<input id="remail" placeholder="Email"><br>
<input id="rpass" type="password" placeholder="Password"><br>
<button class="btn btn-blue" onclick="reg()">Register</button>
<button class="btn btn-blue" onclick="log()">Login</button>
<div id="msg"></div>
</div>

<div id="dash">
<div class="top">
<div class="logo">Binary<span>Pro</span></div>
<div class="rtop">
<span class="bal">Real $<span id="balance">0.00</span></span>
<button class="btn btn-gray" onclick="logout()">Logout</button>
</div>
</div>
<h2 style="padding:20px;text-align:center">Dashboard Loading...</h2>
</div>

<script>
let bal=0,token=localStorage.t;

if(token){
  auth.style.display='none'; 
  dash.style.display='block'; 
}

async function reg(){
  let r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'user',email:remail.value,password:rpass.value})});
  let d=await r.json();
  msg.innerText=d.message;
  if(d.success){msg.style.color='#22c55e'}else{msg.style.color='#ef4444'}
}

async function log(){
  let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:remail.value,password:rpass.value})});
  let d=await r.json();
  if(d.token){localStorage.t=d.token;location.reload();}else{msg.innerText=d.message;msg.style.color='#ef4444'}
}

function logout(){localStorage.removeItem('t');location.reload();}
</script>
</body>
</html>
