<!DOCTYPE html>
<html>
<head>
  <title>BinaryPro - Trade</title>
  <script src="https://s3.tradingview.com/tv.js"></script>
  <style>
    body{background:#0a0d17;color:white;font-family:'Segoe UI',Arial;margin:0}
    .navbar{background:#111827;padding:10px 20px;display:flex;justify-content:space-between;align-items:center}
    .btn{background:#3b82f6;border:none;color:white;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:bold}
    .btn.green{background:#10b981}
    .balance{color:#10b981;font-weight:bold;font-size:18px}
    .main{display:flex}
    .left-panel{width:250px;background:#111827;padding:15px}
    .chart-area{flex:1;padding:15px}
    .right-panel{width:320px;background:#111827;padding:15px}
    #tradingview_chart{height:400px;border-radius:10px}
    .vol-select{background:#1f2937;color:white;padding:10px;border:none;border-radius:8px;width:100%;font-size:16px;margin-bottom:5px}
    .vol-price{font-size:14px;color:#9ca3af;margin-bottom:10px}
    .digits-row{display:flex;justify-content:space-between;margin:15px 0;padding:10px;background:#111827;border-radius:10px}
    .digit-circle{text-align:center;flex:1}
    .digit-circle .circle{width:45px;height:45px;border-radius:50%;background:#1f2937;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;margin:0 auto 5px;border:2px solid #374151;transition:0.3s}
    .digit-circle.active .circle{background:#10b981;border-color:#10b981}
    .digit-circle .percent{color:#10b981;font-size:11px}
    #pointerBar{height:4px;background:#374151;border-radius:2px;margin-top:5px;transition:0.3s}
    .btn-trade{width:100%;padding:14px;font-size:16px;border:none;border-radius:10px;color:white;margin:5px 0;font-weight:bold;cursor:pointer}
    .btn-even{background:#10b981} .btn-odd{background:#ef4444}
    input{padding:10px;border-radius:8px;border:1px solid #374151;background:#1f2937;color:white;width:100%;text-align:center}
    .auth{text-align:center;padding-top:80px}
    .auth input{display:block;margin:12px auto;padding:12px;width:300px;border-radius:8px;border:1px solid #374151;background:#1f2937;color:white}
    .dashboard{display:none}
  </style>
</head>
<body>
  
  <!-- AUTH -->
  <div id="authBox" class="auth">
    <h1>Binary<span style="color:#3b82f6">Pro</span></h1>
    <div id="registerBox">
      <h2>Create Account</h2>
      <input id="regName" placeholder="Full Name">
      <input id="regEmail" placeholder="Email">
      <input id="regPass" type="password" placeholder="Password">
      <button class="btn" onclick="register()">Register</button>
      <p>Already have account? <a onclick="showLogin()" style="color:#3b82f6">Login</a></p>
    </div>
    <div id="loginBox" style="display:none">
      <h2>Login</h2>
      <input id="logEmail" placeholder="Email">
      <input id="logPass" type="password" placeholder="Password">
      <button class="btn" onclick="login()">Login</button>
      <p>Don't have account? <a onclick="showRegister()" style="color:#3b82f6">Register</a></p>
    </div>
    <div id="authMsg" style="color:#10b981"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="dashboard">
    <div class="navbar">
      <div><b>Binary</b><span style="color:#3b82f6">Pro</span></div>
      <div>
        <button class="btn">Deposit</button>
        <button class="btn">Withdraw</button>
        <span class="balance">$<span id="balance">8000.00</span></span>
      </div>
    </div>

    <div class="main">
      <div class="left-panel">
        <h3>No open positions</h3>
        <p style="color:#9ca3af">Your active trades will appear here</p>
      </div>

      <div class="chart-area">
        <!-- DROPDOWN FOR VOLATILITIES -->
        <select class="vol-select" id="volSelect" onchange="loadChart()">
          <option>Volatility 10 (1s) Index</option>
          <option>Volatility 25 (1s) Index</option>
          <option>Volatility 50 (1s) Index</option>
          <option>Volatility 75 (1s) Index</option>
          <option>Volatility 100 (1s) Index</option>
        </select>
        <div class="vol-price">9547.77 -47.77 (0.50%)</div>
        
        <!-- CHART FIRST -->
        <div id="tradingview_chart"></div>
        
        <!-- DIGITS 0-9 BELOW CHART -->
        <div class="digits-row" id="digitsRow"></div>
        <div id="pointerBar"></div>
      </div>

      <div class="right-panel">
        <h3>TRADING MODE</h3>
        <button class="btn" style="width:48%">AUTO</button>
        <button class="btn" style="width:48%;background:#374151">MANUAL</button>
        <br><br>
        <label>STAKE AMOUNT</label><br>
        <input id="amount" type="number" value="10">
        <br><br>
        <button class="btn-trade btn-even" onclick="trade('EVEN')">Even 95.22%</button>
        <button class="btn-trade btn-odd" onclick="trade('ODD')">Odd 95.22%</button>
        <button class="btn-trade" style="background:#8b5cf6" onclick="trade('MATCH')">Match Digit</button>
        <input id="digit" placeholder="Pick Digit 0-9" style="margin-top:5px">
        <div id="msg" style="margin-top:10px;font-weight:bold;text-align:center"></div>
      </div>
    </div>
  </div>

<script>
let balance = 8000;
let token = localStorage.getItem('token');
let currentDigit = 0;

if(!token){ 
  document.getElementById('authBox').style.display='block'; 
  document.getElementById('dashboard').style.display='none'; 
} else {
  document.getElementById('authBox').style.display='none'; 
  document.getElementById('dashboard').style.display='block'; 
  loadChart(); drawDigits();
}

function showLogin(){document.getElementById('registerBox').style.display='none'; document.getElementById('loginBox').style.display='block';}
function showRegister(){document.getElementById('loginBox').style.display='none'; document.getElementById('registerBox').style.display='block';}

async function register(){
  const res = await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:regName.value,email:regEmail.value,password:regPass.value})});
  authMsg.innerText = (await res.json()).message;
}
async function login(){
  const res = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:logEmail.value,password:logPass.value})});
  const data = await res.json();
  if(data.token){ localStorage.setItem('token', data.token); location.reload(); }
  else{ authMsg.innerText = data.message; }
}

function loadChart(){
  document.getElementById('tradingview_chart').innerHTML = '';
  new TradingView.widget({"width":"100%","height":400,"symbol":"CRYPTO:BTCUSD","theme":"dark","container_id":"tradingview_chart"});
}

function drawDigits(){
  const row = document.getElementById('digitsRow');
  row.innerHTML = '';
  for(let i=0;i<10;i++){
    let percent = (Math.random()*5+8).toFixed(1);
    row.innerHTML += `
      <div class="digit-circle" id="digit${i}">
        <div class="circle">${i}</div>
        <div class="percent">${percent}%</div>
      </div>
    `;
  }
  // Animate pointer
  setInterval(()=>{
    document.querySelectorAll('.digit-circle').forEach(c=>c.classList.remove('active'));
    currentDigit = Math.floor(Math.random()*10);
    document.getElementById(`digit${currentDigit}`).classList.add('active');
    document.getElementById('pointerBar').style.background='#10b981';
    setTimeout(()=>{document.getElementById('pointerBar').style.background='#374151'}, 800);
  }, 1500);
}

function trade(direction){
  let amount = parseFloat(document.getElementById('amount').value);
  if(amount > balance){ msg.innerText = "Not enough balance"; msg.style.color="#ef4444"; return; }
  balance -= amount;
  let lastDigit = currentDigit;
  let win = false;
  
  if(direction === 'EVEN') win = lastDigit % 2 === 0;
  if(direction === 'ODD') win = lastDigit % 2 === 1;
  if(direction === 'MATCH'){ let d = parseInt(document.getElementById('digit').value); win = lastDigit === d; }
  
  document.getElementById('pointerBar').style.background = win ? '#10b981' : '#ef4444';
  
  if(win){ balance += amount * 1.8; msg.innerText = `WIN! +$${(amount*0.8).toFixed(2)} | Digit: ${lastDigit}`; msg.style.color="#10b981"; } 
  else { msg.innerText = `LOSS -$${amount.toFixed(2)} | Digit: ${lastDigit}`; msg.style.color="#ef4444"; }
  document.getElementById('balance').innerText = balance.toFixed(2);
}
</script>
</body>
</html>
