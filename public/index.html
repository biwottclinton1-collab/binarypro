<!DOCTYPE html>
<html>
<head>
    <title>Binary Pro - Sign Up</title>
</head>
<body style="background:#0a0a0a; color:white; text-align:center; padding-top:100px; font-family:Arial;">
    <h1>Binary Pro</h1>
    <h3>Create Your Free Account</h3>
    
    <input id="username" placeholder="Full Name" style="padding:10px"><br><br>
    <input id="email" placeholder="Email" style="padding:10px"><br><br>
    <input id="password" type="password" placeholder="Password" style="padding:10px"><br><br>
    
    <button onclick="signup()" style="padding:10px 20px; background:cyan; border:none; cursor:pointer;">Register</button>
    <p id="msg" style="color:lightgreen"></p>

    <script>
    async function signup(){
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const res = await fetch('/api/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, email, password})
        });

        const data = await res.json();
        document.getElementById('msg').innerText = data.message;
    }
    </script>
</body>
</html>
