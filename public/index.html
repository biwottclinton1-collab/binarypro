<!DOCTYPE html>
<html>
<head>
  <title>BinaryPro - Trade</title>
  <script src="https://s3.tradingview.com/tv.js"></script>
  <style>
    body{background:#050510;color:white;font-family:Arial;margin:0}
    .topbar{background:#0f0f2a;padding:10px;display:flex;justify-content:space-between;align-items:center}
    .balance{color:#a855f7;font-weight:bold}
    .deposit{background:#a855f7;border:none;color:white;padding:8px 15px;border-radius:20px;cursor:pointer}
    #tradingview_chart{height:300px}
    .tabs{display:flex;overflow-x:auto;background:#0a0a1f}
    .tab{padding:12px 15px;cursor:pointer;white-space:nowrap}
    .tab.active{background:#a855f7}
    .controls{text-align:center;padding:20px}
    .ticks button{padding:8px 12px;margin:3px;background:#1a1a3a;color:white;border:none;border-radius:5px}
    .ticks .active{background:#a855f7}
    .btn-trade{background:#22c55e;width:45%;padding:15px;font-size:18px;border:none;border-radius:10px;color:white;margin:5px}
    .btn-trade.red{background:#ef4444}
    .profit-loss{display:flex;justify-content:space-around;margin:15px}
    .card{background:#0f0f2a;padding:10px;border-radius:10px;width:45%}
    input{padding:10px;border-radius:5px;border:none;width:100px;text-align:center}
  </style>
</head>
<body>
  <div class="topbar">
    <div>Binary<span style="color:#a855f7">Pro</span></div>
    <div class="balance">$<span id="balance">1000.00</span></div>
    <button class="deposit" onclick="alert('Deposit coming')">+ Deposit</button>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="setMode('RISE')">Rise/Fall</div>
    <div class="tab" onclick="setMode('EVEN')">Even/Odd</div>
    <div class="tab" onclick="setMode('OVER')">Over/Under</div>
    <div class="tab" onclick="setMode('MATCH')">Matches/Differs</div>
  </div>

  <div id="tradingview_chart"></div>

  <div class="profit-loss">
    <div class="card">TARGET PROFIT<br>$<input id="target" value="20"></div>
    <div class="card">STOP LOSS<br>$<input id="stoploss" value="15"></div>
  </div>

  <div class="controls">
    <label>Duration Ticks: </label>
    <div class="ticks">
      <button onclick="setTicks(1)">1</button>
      <button onclick="setTicks(3)">3</button>
      <button class="active" onclick="setTicks(5)">5</button>
      <button onclick="setTicks(10)">10</button>
    </div>
    <br>
    <div id="extraInput"></div>
    <input id="amount" type="number" value="10">
    <br><br>
    <div id="tradeButtons"></div>
    <div id="msg" style="margin-top:10px;color:#22c55e"></div>
  </div>

<script>
let balance = 1000;
let ticks = 5;
let mode = 'RISE';

new TradingView.widget({"width":"100%","height":300,"symbol":"FX:EURUSD","theme":"dark","container_id":"tradingview_chart"});

function setTicks(t){ ticks=t; document.querySelectorAll('.ticks button').forEach(b=>b.classList.remove('active')); event.target.classList.add('active'); }

function setMode(m){
  mode = m;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  renderButtons();
}

function renderButtons(){
  let btns = '';
  let extra = '';
  if(mode === 'RISE'){
    btns = `<button class="btn-trade" onclick="trade('RISE')">RISE</button><button class="btn-trade red" onclick="trade('FALL')">FALL</button>`;
  }
  if(mode === 'EVEN'){
    btns = `<button class="btn-trade" onclick="trade('EVEN')">EVEN</button><button class="btn-trade red" onclick="trade('ODD')">ODD</button>`;
  }
  if(mode === 'OVER'){
    extra = `<input id="barrier" placeholder="Barrier e.g 1.1690">`;
    btns = `<button class="btn-trade" onclick="trade('OVER')">OVER</button><button class="btn-trade red" onclick="trade('UNDER')">UNDER</button>`;
  }
  if(mode === 'MATCH'){
    extra = `<input id="digit" placeholder="Digit 0-9">`;
    btns = `<button class="btn-trade" onclick="trade('MATCH')">MATCHES</button><button class="btn-trade red" onclick="trade('DIFFERS')">DIFFERS</button>`;
  }
  document.getElementById('extraInput').innerHTML = extra;
  document.getElementById('tradeButtons').innerHTML = btns;
}
renderButtons();

function trade(direction){
  let amount = parseFloat(document.getElementById('amount').value);
  if(amount > balance){ msg.innerText = "Not enough balance"; return; }
  balance -= amount;
  
  let lastDigit = Math.floor(Math.random()*10); // simulate last digit
  let win = Math.random() > 0.5; // 50/50 for demo
  
  // Real logic for demo
  if(mode === 'EVEN') win = (lastDigit % 2 === 0 && direction === 'EVEN') || (lastDigit % 2 === 1 && direction === 'ODD');
  if(mode === 'OVER'){ let barrier = parseFloat(document.getElementById('barrier').value) || 1.1690; win = (Math.random()*2 > barrier && direction === 'OVER'); }
  if(mode === 'MATCH'){ let d = parseInt(document.getElementById('digit').value); win = (lastDigit === d && direction === 'MATCH') || (lastDigit !== d && direction === 'DIFFERS'); }
  
  if(win){
    balance += amount * 1.8;
    msg.innerText = `YOU WON! +$${(amount*0.8).toFixed(2)} | Last digit: ${lastDigit}`;
  } else {
    msg.innerText = `YOU LOST -$${amount.toFixed(2)} | Last digit: ${lastDigit}`;
  }
  document.getElementById('balance').innerText = balance.toFixed(2);
}
</script>
</body>
</html>
