<!DOCTYPE html>
<html>
<head>
  <title>BinaryPro - Deriv</title>
  <style>
    body{background:#0a0d17;color:white;font-family:'Segoe UI',Arial;margin:0}
    .navbar{background:#111827;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
    .nav-right{display:flex;gap:15px;align-items:center}
    .nav-btn{color:#9ca3af;cursor:pointer}
    .btn{background:#3b82f6;border:none;color:white;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:bold}
    .btn.green{background:#10b981}
    .balance{color:#10b981;font-weight:bold;font-size:18px}
    .main{display:flex;height:calc(100vh - 60px)}
    .left-panel{width:300px;background:#111827;padding:15px;border-right:1px solid #1f2937}
    .position-tabs{display:flex;border-bottom:1px solid #1f2937}
    .p-tab{flex:1;padding:10px;text-align:center;cursor:pointer;color:#9ca3af}
    .p-tab.active{color:white;border-bottom:2px solid #3b82f6}
    .chart-area{flex:1;padding:15px;overflow-y:auto}
    .right-panel{width:320px;background:#111827;padding:15px}
    .fake-chart{height:350px;background:linear-gradient(180deg,#0f172a 0%,#020617 100%);border-radius:10px}
    .vol-select{background:#1f2937;color:white;padding:10px;border:none;border-radius:8px;width:100%;font-size:16px;margin-bottom:10px}
    .digits-row{display:flex;justify-content:space-between;margin:15px 0;padding:15px;background:#111827;border-radius:12px}
    .digit-circle{text-align:center;flex:1}
    .digit-circle .circle{width:50px;height:50px;border-radius:50%;background:#1f2937;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;font-weight:bold;margin:0 auto;border:2px solid #374151;transition:0.3s}
    .digit-circle .circle.win{background:#10b981;border-color:#10b981}
    .digit-circle .circle.loss{background:#ef4444;border-color:#ef4444}
    .digit-circle .percent{font-size:10px;color:#10b981;margin-top:2px}
    .market-btns{display:flex;gap:8px;margin:15px 0;flex-wrap:wrap}
    .m-btn{flex:1;min-width:120px;padding:12px;background:#1f2937;border:1px solid #374151;color:white;border-radius:8px;cursor:pointer;font-weight:bold}
    .m-btn.active{border-color:#3b82f6;background:#1e3a8a}
    .trade-row{display:flex;gap:10px;margin:15px 0}
    .trade-row input{flex:1;padding:12px;border-radius:8px;border:1px solid #374151;background:#1f2937;color:white;text-align:center}
    .btn-trade{width:100%;padding:16px;font-size:18px;border:none;border-radius:10px;background:#10b981;color:white;font-weight:bold;cursor:pointer;margin-top:10px}
    .auth{text-align:center;padding-top:80px}
    .auth input{display:block;margin:12px auto;padding:12px;width:300px;border-radius:8px;border:1px solid #374151;background:#1f2937;color:white}
    .dashboard{display:none}
    .history-item{padding:10px;background:#1f2937;margin:5px 0;border-radius:8px;font-size:13px}
    .history-item.open{border-left:3px solid #f59e0b}
    .history-item.win{border-left:3px solid #10b981} 
    .history-item.loss{border-left:3px solid #ef4444}
  </style>
</head>
<body>
  
  <!-- AUTH -->
  <div id="authBox" class="auth">
    <h1>Binary<span style="color:#3b82f6">Pro</span></h1>
    <div id="registerBox">
      <h2>Create Account</h2>
      <input id="regName" placeholder="Full Name">
      <input id="regEmail" placeholder="Email">
      <input id="regPass" type="password" placeholder="Password">
      <button class="btn" onclick="register()">Register</button>
      <p>Already have account? <a onclick="showLogin()" style="color:#3b82f6">Login</a></p>
    </div>
    <div id="loginBox" style="display:none">
      <h2>Login</h2>
      <input id="logEmail" placeholder="Email">
      <input id="logPass" type="password" placeholder="Password">
      <button class="btn" onclick="login()">Login</button>
      <p>Don't have account? <a onclick="showRegister()" style="color:#3b82f6">Register</a></p>
    </div>
    <div id="authMsg" style="color:#10b981"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="dashboard">
    <div class="navbar">
      <div><b>Binary</b><span style="color:#3b82f6">Pro</span></div>
      <div class="nav-right">
        <div class="nav-btn">➕ Deposit</div>
        <div class="nav-btn">➖ Withdraw</div>
        <div class="nav-btn">🕒 History</div>
        <span>Real</span>
        <span class="balance">$<span id="balance">8000.00</span></span>
        <button class="btn" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="main">
      <!-- LEFT: HISTORY WITH OPEN POSITIONS -->
      <div class="left-panel">
        <div class="position-tabs">
          <div class="p-tab active" onclick="showTab('open')">Open (<span id="openCount">0</span>)</div>
          <div class="p-tab" onclick="showTab('closed')">Closed (<span id="closedCount">0</span>)</div>
          <div class="p-tab" onclick="showTab('transactions')">Transactions</div>
        </div>
        <div id="openTab"><p style="color:#9ca3af;text-align:center;padding-top:20px">No open positions</p></div>
        <div id="closedTab" style="display:none"></div>
        <div id="transactionsTab" style="display:none"></div>
      </div>

      <div class="chart-area">
        <!-- 1. VOLATILITY -->
        <select class="vol-select" id="volSelect">
          <option>Volatility 10 (1s) Index</option>
          <option>Volatility 25 (1s) Index</option>
          <option>Volatility 50 (1s) Index</option>
          <option>Volatility 75 (1s) Index</option>
          <option>Volatility 100 (1s) Index</option>
        </select>

        <!-- 2. CHART -->
        <div class="fake-chart"><canvas id="priceChart" width="900" height="330"></canvas></div>
        
        <!-- 3. 10 DIGIT CIRCLES -->
        <div class="digits-row" id="digitsRow"></div>

        <!-- 4. MARKET BUTTONS BELOW CIRCLES -->
        <div class="market-btns">
          <button class="m-btn active" onclick="setMode('EVEN')">Even/Odd</button>
          <button class="m-btn" onclick="setMode('OVER')">Over/Under</button>
          <button class="m-btn" onclick="setMode('RISE')">Rise/Fall</button>
          <button class="m-btn" onclick="setMode('MATCH')">Matches/Differs</button>
        </div>

        <!-- 5. STAKE | TP | SL HORIZONTAL -->
        <div class="trade-row">
          <input id="amount" type="number" placeholder="Stake $">
          <input id="tp" type="number" placeholder="Take Profit $">
          <input id="sl" type="number" placeholder="Stop Loss $">
        </div>
        <div id="modeInputs"></div>
        <button class="btn-trade" onclick="placeTrade()">Place Trade</button>
        <div id="msg" style="margin-top:10px;font-weight:bold;text-align:center"></div>
      </div>

      <div class="right-panel">
        <h3>Market Info</h3>
        <p style="color:#9ca3af">Select a market above to trade</p>
      </div>
    </div>
  </div>

<script>
let balance = 8000;
let token = localStorage.getItem('token');
let currentMode = 'EVEN';
let currentDigit = 0;
let openTrades = [];
let tradeHistory = [];

function logout(){ localStorage.removeItem('token'); location.reload(); }

if(!token){ 
  document.getElementById('authBox').style.display='block'; 
  document.getElementById('dashboard').style.display='none'; 
} else {
  document.getElementById('authBox').style.display='none'; 
  document.getElementById('dashboard').style.display='block'; 
  drawDigits(); drawChart(); renderInputs();
}

function showLogin(){document.getElementById('registerBox').style.display='none'; document.getElementById('loginBox').style.display='block';}
function showRegister(){document.getElementById('loginBox').style.display='none'; document.getElementById('registerBox').style.display='block';}

function showTab(t){
  document.querySelectorAll('.p-tab').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('openTab').style.display = t==='open'?'block':'none';
  document.getElementById('closedTab').style.display = t==='closed'?'block':'none';
  document.getElementById('transactionsTab').style.display = t==='transactions'?'block':'none';
}

function setMode(m){ 
  currentMode=m; 
  document.querySelectorAll('.m-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  renderInputs(); 
}

function renderInputs(){
  let html = '';
  if(currentMode === 'OVER' || currentMode === 'UNDER') html = `<input id="barrier" placeholder="Barrier e.g 5">`;
  if(currentMode === 'MATCH' || currentMode === 'DIFFERS') html = `<input id="digitPick" placeholder="Pick Digit 0-9">`;
  document.getElementById('modeInputs').innerHTML = html;
}

function drawDigits(){
  const row = document.getElementById('digitsRow');
  row.innerHTML = '';
  for(let i=0;i<10;i++){
    let percent = (Math.random()*5+8).toFixed(1);
    row.innerHTML += `
      <div class="digit-circle" id="digit${i}">
        <div class="circle">${i}<span class="percent">${percent}%</span></div>
      </div>
    `;
  }
  setInterval(()=>{
    document.querySelectorAll('.circle').forEach(c=>c.classList.remove('win','loss'));
    currentDigit = Math.floor(Math.random()*10);
    document.getElementById(`digit${currentDigit} .circle`).classList.add('win'); // moving pointer = green
    setTimeout(()=>{document.getElementById(`digit${currentDigit} .circle`).classList.remove('win')}, 1000);
  }, 1500);
}

function drawChart(){
  const ctx = document.getElementById('priceChart').getContext('2d');
  let y = 165; ctx.strokeStyle='#ffffff'; ctx.lineWidth=2; ctx.beginPath();
  for(let x=0;x<900;x+=5){ y += (Math.random()-0.5)*8; if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
  ctx.stroke();
}

function placeTrade(){
  let amount = parseFloat(document.getElementById('amount').value);
  if(amount > balance){ msg.innerText = "Not enough balance"; msg.style.color="#ef4444"; return; }
  balance -= amount;
  
  // ADD TO OPEN POSITIONS
  let tradeId = Date.now();
  openTrades.push({id:tradeId, mode:currentMode, amount, time:new Date().toLocaleTimeString()});
  updateHistory();
  
  setTimeout(()=>{ // simulate trade result after 3s
    let lastDigit = currentDigit;
    let win = false;
    if(currentMode === 'EVEN') win = lastDigit % 2 === 0;
    if(currentMode === 'ODD') win = lastDigit % 2 === 1;
    if(currentMode === 'OVER'){ let b = parseFloat(document.getElementById('barrier').value)||5; win = lastDigit > b; }
    if(currentMode === 'UNDER'){ let b = parseFloat(document.getElementById('barrier').value)||5; win = lastDigit < b; }
    if(currentMode === 'RISE') win = Math.random() > 0.5; // fake
    if(currentMode === 'FALL') win = Math.random() < 0.5;
    if(currentMode === 'MATCH'){ let d = parseInt(document.getElementById('digitPick').value); win = lastDigit === d; }
    if(currentMode === 'DIFFERS'){ let d = parseInt(document.getElementById('digitPick').value); win = lastDigit !== d; }
    
    // COLOR THE CIRCLE: GREEN WIN, RED LOSS
    let circle = document.getElementById(`digit${lastDigit} .circle`);
    circle.classList.add(win?'win':'loss');
    
    // MOVE FROM OPEN TO CLOSED
    let profit = win ? amount * 0.8 : -amount;
    balance += win ? amount * 1.8 : 0;
    tradeHistory.push({mode:currentMode, amount, profit, digit:lastDigit, time:new Date().toLocaleTimeString()});
    openTrades = openTrades.filter(t=>t.id!==tradeId);
    updateHistory();
    
    msg.innerText = win ? `WIN! +$${profit.toFixed(2)} | Digit: ${lastDigit}` : `LOSS $${Math.abs(profit).toFixed(2)} | Digit: ${lastDigit}`; 
    msg.style.color = win ? "#10b981" : "#ef4444";
    document.getElementById('balance').innerText = balance.toFixed(2);
  }, 3000);
}

function updateHistory(){
  let openHtml = openTrades.length ? '' : '<p style="color:#9ca3af;text-align:center">No open positions</p>';
  openTrades.forEach(t=>{
    openHtml += `<div class="history-item open">OPEN: ${t.mode} - $${t.amount}<br><small>${t.time}</small></div>`;
  });
  document.getElementById('openTab').innerHTML = openHtml;
  document.getElementById('openCount').innerText = openTrades.length;
  
  let closedHtml = '';
  tradeHistory.forEach(t=>{
    closedHtml += `<div class="history-item ${t.profit>0?'win':'loss'}">
      ${t.mode} - $${t.amount} - Digit:${t.digit} - ${t.profit>0?'+':''}$${t.profit.toFixed(2)}<br>
      <small style="color:#9ca3af">${t.time}</small>
    </div>`;
  });
  document.getElementById('closedTab').innerHTML = closedHtml || '<p style="color:#9ca3af;text-align:center">No closed trades</p>';
  document.getElementById('closedCount').innerText = tradeHistory.length;
  document.getElementById('transactionsTab').innerHTML = closedHtml;
}
</script>
</body>
</html>
