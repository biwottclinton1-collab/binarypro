<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BinaryPro</title>
<style>
body{background:#050a14;color:#fff;margin:0;font-family:Arial}
.topbar{display:flex;justify-content:space-between;padding:10px;background:#0a1120}
.logo{font-weight:800;font-size:18px}.logo span{color:#3b82f6}
.bal{background:#1a2332;padding:5px 10px;border-radius:5px}
.btn{background:#2563eb;color:#fff;border:0;padding:8px 16px;border-radius:5px;cursor:pointer}
#chart{width:100%;height:300px;background:#070b14;display:block}
.digits{display:flex;justify-content:space-around;margin:5px 0}
.digit{width:38px;height:38px;border-radius:50%;background:#111827;border:2px solid #334155;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px}
.digit.win{border-color:#22c55e;background:#22c55e}
.digit.loss{border-color:#ef4444;background:#ef4444}
.trade{display:flex;gap:8px}.trade button{flex:1;padding:18px;border:0;border-radius:8px;font-weight:800;font-size:16px;color:#fff;cursor:pointer}
.green{background:#16a34a}.red{background:#dc2626}
.stake{text-align:center;background:#0a1120;padding:10px;margin-top:10px;border-radius:8px}
.ai{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border:0;color:#fff;margin:10px auto;display:block}
.auth{text-align:center;padding-top:100px}
.auth input{width:300px;padding:12px;margin:8px;background:#1a2332;border:1px solid #334155;color:#fff}
#dashboard{display:none}
</style>
</head>
<body>

<div id="auth" class="auth">
<h1 class="logo">Binary<span>Pro</span></h1>
<input id="remail" placeholder="Email"><br>
<input id="rpass" type="password" placeholder="Password"><br>
<button class="btn" onclick="reg()">Register</button>
<button class="btn" onclick="log()">Login</button>
<div id="msg"></div>
</div>

<div id="dashboard">
<div class="topbar">
<div class="logo">Binary<span>Pro</span></div>
<div><span class="bal">Real $<span id="balance">8000.00</span></span> <button class="btn">Deposit</button> <button class="btn" onclick="logout()">Logout</button></div>
</div>

<div style="padding:10px">
<select style="background:#1a2332;color:#fff;padding:5px"><option>Volatility 10 (1s) Index</option></select>
<span style="float:right"><span id="cprice">9599.71</span> <span style="color:red">-47.77</span></span>

<canvas id="chart"></canvas>

<div class="digits" id="digits"></div>
<div style="display:flex;justify-content:space-between;font-size:10px;color:#64748b"><span>03:14:28</span><span>03:14:43</span><span>03:14:59</span><span>03:15:08</span><span>03:15:14</span></div>

<div class="trade">
<button class="green" onclick="trade('EVEN')">Even<br><small id="evenP">19.52 USD 95.22%</small></button>
<button class="red" onclick="trade('ODD')">Odd<br><small id="oddP">19.52 USD 95.22%</small></button>
</div>

<div class="stake">
STAKE: $<span id="stake">10</span><br>
<button onclick="s(-1)">-</button><button onclick="s(1)">+</button><br>
<button onclick="setS(1)">$1</button><button onclick="setS(5)">$5</button><button onclick="setS(10)">$10</button><button onclick="setS(25)">$25</button><button onclick="setS(50)">$50</button><button onclick="setS(100)">$100</button>
<div>Payout: $<span id="payout">19.52</span></div>
<button class="ai">AI</button>
</div>
<div id="tmsg"></div>
</div>
</div>

<script>
let bal=8000,stake=10,token=localStorage.t,tradeType=null;
const pct=[10.8,10.2,10.2,9,10.6,9.6,9.2,11.6,9.8,9];

if(token){auth.style.display='none';dashboard.style.display='block';me();}

async function reg(){let r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'boss',email:remail.value,password:rpass.value})});msg.innerText=(await r.json()).message;}
async function log(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:remail.value,password:rpass.value})});let d=await r.json();if(d.token){localStorage.t=d.token;location.reload();}else{msg.innerText=d.message;}}
async function me(){let r=await fetch('/api/me',{headers:{'Authorization':'Bearer '+token}});let u=await r.json();bal=parseFloat(u.balance);balance.innerText=bal.toFixed(2);draw();}
function logout(){localStorage.removeItem('t');location.reload();}
function setS(x){stake=x;update();}
function s(x){stake+=x;if(stake<1)stake=1;update();}
function update(){stake.innerText=stake;payout.innerText=(stake*1.952).toFixed(2);evenP.innerText=(stake*1.952).toFixed(2)+' USD 95.22%';oddP.innerText=(stake*1.952).toFixed(2)+' USD 95.22%';}
async function trade(t){if(stake>bal){tmsg.innerText='No money';return;}bal-=stake;tradeType=t;tmsg.innerText='Waiting for digit...';}

function draw(){
const c=document.getElementById('chart'),ctx=c.getContext('2d');c.width=c.offsetWidth;c.height=300;
digits.innerHTML='';for(let i=0;i<10;i++)digits.innerHTML+=`<div class="digit" id="d${i}">${i}<div style="font-size:7px">${pct[i]}%</div></div>`;
let data=Array(500).fill(150),last=-1;
setInterval(()=>{
ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle='#fff';ctx.beginPath();
for(let i=0;i<data.length;i++)i?ctx.lineTo(i*2,data[i]):ctx.moveTo(i*2,data[i]);ctx.stroke();
data.shift();let y=data[data.length-1]+(Math.random()-0.5)*12;y=Math.max(50,Math.min(250,y));data.push(y);
let digit=Math.floor((y-50)/20);
if(digit!=last && digit>=0 && digit<10){
document.querySelectorAll('.digit').forEach(d=>d.className='digit');
if(tradeType){
let win=(tradeType=='EVEN'&&digit%2==0)||(tradeType=='ODD'&&digit%2==1);
if(win){bal+=stake*1.952;document.getElementById('d'+digit).classList.add('win');tmsg.innerText='WIN! '+digit;tmsg.style.color='lime';}
else{document.getElementById('d'+digit).classList.add('loss');tmsg.innerText='LOSS! '+digit;tmsg.style.color='red';}
fetch('/api/update-balance',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({newBalance:bal})});
balance.innerText=bal.toFixed(2);tradeType=null;
}else{document.getElementById('d'+digit).style.borderColor='#3b82f6';}
last=digit;
}
cprice.innerText=(9500+Math.random()*200).toFixed(2);
},200);
}
</script>
</body>
</html>
