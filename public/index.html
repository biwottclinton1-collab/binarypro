<!DOCTYPE html>
<html>
<head>
  <title>Binary Pro</title>
  <style>
    body{background:#0a0a23;color:white;text-align:center;font-family:Arial}
    input,button{padding:10px;margin:5px;border-radius:5px;border:none}
    button{background:#00f5d4;color:#000;cursor:pointer}
    #msg{color:#00ff88;margin-top:10px}
  </style>
</head>
<body>
  <h1>Binary Pro</h1>
  
  <div id="register">
    <h2>Create Your Free Account</h2>
    <input id="regName" placeholder="Name"><br>
    <input id="regEmail" placeholder="Email"><br>
    <input id="regPass" type="password" placeholder="Password"><br>
    <button onclick="register()">Register</button>
    <p>Already have an account? <a href="#" onclick="showLogin()">Login</a></p>
  </div>

  <div id="login" style="display:none">
    <h2>Login to Your Account</h2>
    <input id="logEmail" placeholder="Email"><br>
    <input id="logPass" type="password" placeholder="Password"><br>
    <button onclick="login()">Login</button>
    <p>Don't have account? <a href="#" onclick="showRegister()">Register</a></p>
  </div>

  <div id="msg"></div>

<script>
async function register(){
  const res = await fetch('/api/register',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      username:regName.value,
      email:regEmail.value,
      password:regPass.value
    })
  });
  const data = await res.json();
  msg.innerText = data.message;
}

async function login(){
  const res = await fetch('/api/login',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      email:logEmail.value,
      password:logPass.value
    })
  });
  const data = await res.json();
  msg.innerText = data.message;
  if(data.token){
    localStorage.setItem('token', data.token);
    msg.innerText = "Login successful! Redirecting to Trading...";
    // NEXT: we will redirect to dashboard.html
  }
}

function showLogin(){ register.style.display='none'; login.style.display='block'; }
function showRegister(){ login.style.display='none'; register.style.display='block'; }
</script>
</body>
</html>
