<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BinaryPro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0e14;color:#fff}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 15px;background:#0f1421}
.logo{font-size:20px;font-weight:800}.logo span{color:#3b82f6}
.topbtns{display:flex;gap:8px;align-items:center}
.bal{background:#1a2332;padding:6px 12px;border-radius:6px;font-weight:700}
.btn{padding:6px 14px;border:0;border-radius:6px;font-weight:700;cursor:pointer}
.btn-blue{background:#2563eb;color:#fff}
.btn-gray{background:#374151;color:#fff}
.container{display:flex;gap:10px;padding:10px}
.left{flex:1}
.select{background:#1a2332;color:#fff;border:1px solid #334155;padding:6px;border-radius:5px}
.price{text-align:right;color:#94a3b8;font-size:14px}
#chart{width:100%;height:300px;background:#070b14;border-radius:8px;margin:8px 0}
.digits{display:flex;justify-content:space-between;gap:4px;margin:10px 0}
.digit{flex:1;text-align:center;background:#1a2332;padding:8px 0;border-radius:50%;border:2px solid #2a3441;font-size:12px}
.digit.active{border-color:#60a5fa;box-shadow:0 0 10px #60a5fa}
.times{display:flex;justify-content:space-between;font-size:10px;color:#64748b;margin-bottom:10px}
.trade{display:flex;gap:8px;margin-bottom:10px}
.trade button{flex:1;padding:15px;border:0;border-radius:8px;color:#fff;font-weight:800;font-size:15px;cursor:pointer}
.green{background:#16a34a}.red{background:#dc2626}
.tabs{display:flex;background:#1a2332;border-radius:8px;padding:4px;margin-bottom:10px}
.tab{flex:1;text-align:center;padding:8px;border-radius:6px;cursor:pointer;font-size:12px}
.tab.active{background:#2563eb}
.subtabs{display:flex;gap:8px;margin-bottom:10px}
.subtab{flex:1;text-align:center;padding:8px;background:#1a2332;border-radius:6px;font-size:12px;cursor:pointer}
.subtab.active{background:#2563eb}
.stake{background:#1a2332;padding:10px;border-radius:8px}
.stake-row{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
.stake-btn{width:30px;height:30px;background:#334155;border:0;color:#fff;border-radius:5px;cursor:pointer}
.stake-amounts{display:flex;gap:5px}
.stake-amounts button{flex:1;padding:8px;background:#334155;border:0;color:#fff;border-radius:5px;cursor:pointer}
.stake-amounts button.active{background:#2563eb}
.ai-btn{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border:0;color:#fff;font-weight:800;font-size:16px;margin:15px auto;display:block;box-shadow:0 0 20px #3b82f6;cursor:pointer}
.auth{text-align:center;padding-top:80px}
.auth input{width:320px;padding:12px;margin:8px;background:#1a2332;border:1px solid #334155;color:#fff;border-radius:6px}
#dashboard{display:none}
.msg{margin-top:10px;font-weight:700;text-align:center}
</style>
</head>
<body>

<div id="auth" class="auth">
<h1 class="logo">Binary<span>Pro</span></h1>
<div id="regBox">
<h2>Register</h2>
<input id="rname" placeholder="Full Name"><br>
<input id="remail" placeholder="Email"><br>
<input id="rpass" type="password" placeholder="Password"><br>
<button class="btn btn-blue" onclick="doRegister()">Register</button>
<p style="margin-top:10px">Have account? <a onclick="showLogin()" style="color:#3b82f6;cursor:pointer">Login</a></p>
</div>
<div id="logBox" style="display:none">
<h2>Login</h2>
<input id="lemail" placeholder="Email"><br>
<input id="lpass" type="password" placeholder="Password"><br>
<button class="btn btn-blue" onclick="doLogin()">Login</button>
<p style="margin-top:10px">No account? <a onclick="showReg()" style="color:#3b82f6;cursor:pointer">Register</a></p>
</div>
<div id="msg" class="msg"></div>
</div>

<div id="dashboard">
<div class="topbar">
<div class="logo">Binary<span>Pro</span></div>
<div class="topbtns">
<span class="bal">Real $<span id="balance">8000.00</span></span>
<button class="btn btn-blue">Deposit</button>
<button class="btn btn-gray" onclick="logout()">Logout</button>
</div>
</div>

<div class="container">
<div class="left">
<div style="display:flex;justify-content:space-between;align-items:center">
<select class="select"><option>Volatility 10 (1s) Index</option></select>
<div class="price"><span id="cprice">9599.71</span> <span style="color:#ef4444">-47.77 (0.50%)</span></div>
</div>
<canvas id="chart"></canvas>
<div class="digits" id="digits"></div>
<div class="times"><span>03:14:28</span><span>03:14:43</span><span>03:14:59</span><span>03:15:08</span><span>03:15:14</span><span>03:15:19</span></div>
<div class="trade">
<button class="green" onclick="trade('EVEN')">Even<br><small id="evenP">19.52 USD 95.22%</small></button>
<button class="red" onclick="trade('ODD')">Odd<br><small id="oddP">19.52 USD 95.22%</small></button>
</div>
<div class="tabs"><div class="tab active">AUTO</div><div class="tab">MANUAL</div></div>
<div class="subtabs"><div class="subtab active">Even / Odd</div><div class="subtab">Match / Differ</div><div class="subtab">Over / Under</div></div>
<div class="stake">
<div>STAKE AMOUNT</div>
<div class="stake-row">
<button class="stake-btn" onclick="changeStake(-1)">-</button>
<b>$<span id="stake">10</span></b>
<button class="stake-btn" onclick="changeStake(1)">+</button>
</div>
<div class="stake-amounts">
<button onclick="setStake(1)">$1</button><button onclick="setStake(5)">$5</button>
<button onclick="setStake(10)" class="active" id="s10">$10</button>
<button onclick="setStake(25)">$25</button><button onclick="setStake(50)">$50</button><button onclick="setStake(100)">$100</button>
</div>
<div style="text-align:center;margin:8px 0">Payout: $<span id="payout">19.52</span></div>
<button class="ai-btn" onclick="alert('AI Trading Active')">AI</button>
</div>
<div id="tmsg" class="msg"></div>
</div>
</div>
</div>

<script>
let balance=8000,stake=10,token=localStorage.token;
const pct=[10.8,10.2,10.2,9,10.6,9.6,9.2,11.6,9.8,9];

if(token){auth.style.display='none';dashboard.style.display='block';loadUser();}

function showLogin(){regBox.style.display='none';logBox.style.display='block';msg.innerText=''}
function showReg(){logBox.style.display='none';regBox.style.display='block';msg.innerText=''}
function logout(){localStorage.removeItem('token');location.reload();}

async function doRegister(){
msg.style.color='#22c55e';
let r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:rname.value,email:remail.value,password:rpass.value})});
msg.innerText=(await r.json()).message;
}
async function doLogin(){
msg.style.color='#ef4444';
let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:lemail.value,password:lpass.value})});
let d=await r.json();
if(d.token){localStorage.token=d.token;location.reload();}else{msg.innerText=d.message;}
}
async function loadUser(){
let r=await fetch('/api/me',{headers:{'Authorization':'Bearer '+token}});
let u=await r.json();balance=parseFloat(u.balance);document.getElementById('balance').innerText=balance.toFixed(2);init();
}
function setStake(s){stake=s;document.querySelectorAll('.stake-amounts button').forEach(b=>b.classList.remove('active'));document.getElementById('s'+s).classList.add('active');updateStake();}
function changeStake(n){stake+=n;if(stake<1)stake=1;updateStake();}
function updateStake(){document.getElementById('stake').innerText=stake;document.getElementById('payout').innerText=(stake*1.952).toFixed(2);evenP.innerText=(stake*1.952).toFixed(2)+' USD 95.22%';oddP.innerText=(stake*1.952).toFixed(2)+' USD 95.22%';}

async function trade(t){
if(stake>balance){tmsg.innerText='Insufficient balance';tmsg.style.color='red';return;}
balance-=stake;let win=Math.random()>0.5;
if(win){balance+=stake*1.952;tmsg.innerText='WIN +'+(stake*0.952).toFixed(2);tmsg.style.color='#22c55e';}else{tmsg.innerText='LOSS -'+stake;tmsg.style.color='#ef4444';}
document.getElementById('balance').innerText=balance.toFixed(2);
await fetch('/api/update-balance',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({newBalance:balance})});
}

function init(){
digits.innerHTML='';for(let i=0;i<10;i++)digits.innerHTML+=`<div class="digit" id="d${i}">${i}<div style="font-size:8px;color:#22c55e">${pct[i]}%</div></div>`;
setInterval(()=>{document.querySelectorAll('.digit').forEach(d=>d.classList.remove('active'));let dg=Math.floor(Math.random()*10);document.getElementById('d'+dg).classList.add('active');},2000);
const c=chart,ctx=c.getContext('2d');c.width=c.offsetWidth;c.height=300;let data=Array(c.width).fill(150);setInterval(()=>{ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();for(let x=0;x<data.length;x++)x?ctx.lineTo(x,data[x]):ctx.moveTo(x,data[x]);ctx.stroke();data.shift();data.push(Math.max(50,Math.min(250,data[data.length-1]+(Math.random()-0.5)*8)));},100);
}
</script>
</body>
</html>
