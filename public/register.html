<!DOCTYPE html>
<html>
<head><title>Binary Pro - Sign Up</title></head>
<body style="background:#0a0a0a; color:white; text-align:center; padding-top:100px; font-family:Arial">
<h1>Binary Pro</h1>
<h3>Create Your Free Account</h3>
<input id="name" placeholder="Full Name" style="padding:10px"><br><br>
<input id="email" placeholder="Email" style="padding:10px"><br><br>
<input id="password" type="password" placeholder="Password" style="padding:10px"><br><br>
<button onclick="signup()" style="padding:10px 20px; background:cyan; border:none; cursor:pointer">Sign Up</button>
<p id="msg" style="color:lightgreen"></p>

<script>
async function signup(){
 let r = await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},
 body:JSON.stringify({name:name.value,email:email.value,password:password.value})});
 let d = await r.json();
 msg.innerText = d.message || d.error;
}
</script>
</body></html>
